name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run PyTest
        run: pytest -v

  docker:
    name: Docker build and validate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose file
        run: docker compose config --quiet
      - name: Build Docker image
        run: docker build -t expense-tracker:${{ github.sha }} .
      - name: Smoke-test the container
        run: |
          docker run -d --name et -p 5000:5000 expense-tracker:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fs http://localhost:5000/api/health && exit 0
            sleep 2
          done
          docker logs et
          exit 1

  # Optional: runs only on pushes to main AND only if Docker Hub secrets exist.
  publish:
    name: Push to Docker Hub (optional)
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker:latest
      - name: Skipped
        if: ${{ env.DOCKERHUB_USERNAME == '' }}
        run: echo "Docker Hub secrets not configured - skipping push."
